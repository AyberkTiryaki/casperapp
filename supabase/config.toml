# Supabase CLI yapılandırması (yerel geliştirme + `supabase db push` için).
# Bu dosyada GİZLİ ANAHTAR YOKTUR ve olmamalıdır.
project_id = "caspertrainingstudio"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
# Mobil uygulamanın derin bağlantısı (e-posta doğrulama ve şifre sıfırlama dönüşü)
site_url = "caspertraining://auth-callback"
additional_redirect_urls = ["caspertraining://auth-callback"]
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Türkçe, Casper markalı e-posta şablonları (supabase/templates/).
# Ücretsiz planda Supabase şablon değişikliğine yalnızca özel SMTP tanımlıysa izin verir.
# SMTP (ör. Gmail uygulama şifresi) panelden girildikten sonra aşağıdaki satırları açıp
# `supabase config push` çalıştırın. Bkz. docs/KURULUM.md bölüm 7.
# [auth.email.template.confirmation]
# subject = "Casper Training Studio: e-postanızı doğrulayın"
# content_path = "./supabase/templates/confirmation.html"

# [auth.email.template.recovery]
# subject = "Casper Training Studio: şifre sıfırlama"
# content_path = "./supabase/templates/recovery.html"

# [auth.email.template.email_change]
# subject = "Casper Training Studio: e-posta değişikliğini onaylayın"
# content_path = "./supabase/templates/email_change.html"

# Bildirim gönderici: zamanlanmış görev çağırır; kimlik doğrulama x-cron-secret ile yapılır.
[functions.send-notifications]
verify_jwt = false
