# Test APK'sı: main'e her gönderimde (veya Actions sekmesinden elle) Android APK derler.
# APK, çalıştırmanın "Artifacts" bölümünden indirilir ve telefona doğrudan kurulur.
#
# Gerekli repo gizli değerleri (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<proje-ref>.supabase.co
#   SUPABASE_ANON_KEY  Supabase anon (public) anahtarı
#   ANDROID_KEYSTORE_BASE64   yükleme anahtarı (casper-upload.jks) base64
#   ANDROID_KEYSTORE_PASSWORD anahtar şifresi (store ve key aynı, alias: upload)
# Service role anahtarı buraya ASLA eklenmez.
#
# Çıktılar: casper-test-apk (telefona doğrudan kurulur) ve casper-play-aab (Google Play'e yüklenir).
# Anahtar gizli değerleri yoksa ikisi de geçici debug anahtarıyla imzalanır ve mağazaya yüklenemez.
# Sürüm kodu = çalıştırma numarası (Play her yüklemede daha büyük sürüm kodu ister).

name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Yerel geliştirme makinesiyle aynı sürüm: yeni sürümlerdeki uyarılar derlemeyi
      # beklenmedik şekilde kırmasın. Yerelde Flutter güncellenince burası da güncellenir.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Ortam dosyası
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL ve SUPABASE_ANON_KEY repo gizli değerleri tanımlı değil."
            exit 1
          fi
          mkdir -p env
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, APP_ENV: "dev"}' > env/ci.json

      - name: Yükleme anahtarı
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::warning::Yükleme anahtarı tanımlı değil; paketler debug anahtarıyla imzalanacak."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          {
            echo "storePassword=$KEYSTORE_PW"
            echo "keyPassword=$KEYSTORE_PW"
            echo "keyAlias=upload"
            echo "storeFile=upload.jks"
          } > android/key.properties

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: APK derle
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define-from-file=env/ci.json

      - name: Play paketi (AAB) derle
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define-from-file=env/ci.json

      - name: APK adını belirle
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/casper-test-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: casper-test-apk
          path: build/app/outputs/flutter-apk/casper-test-*.apk
          retention-days: 14

      - name: AAB adını belirle
        run: |
          mv build/app/outputs/bundle/release/app-release.aab              "build/app/outputs/bundle/release/casper-play-${{ github.run_number }}-${GITHUB_SHA::7}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: casper-play-aab
          path: build/app/outputs/bundle/release/casper-play-*.aab
          retention-days: 30
