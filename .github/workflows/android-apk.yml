# Test APK'sı: main'e her gönderimde (veya Actions sekmesinden elle) Android APK derler.
# APK, çalıştırmanın "Artifacts" bölümünden indirilir ve telefona doğrudan kurulur.
#
# Gerekli repo gizli değerleri (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<proje-ref>.supabase.co
#   SUPABASE_ANON_KEY  Supabase anon (public) anahtarı
# Service role anahtarı buraya ASLA eklenmez.
#
# Not: Bu APK test amaçlıdır ve geçici (debug) anahtarla imzalanır; mağaza için kullanılamaz.

name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Yerel geliştirme makinesiyle aynı sürüm: yeni sürümlerdeki uyarılar derlemeyi
      # beklenmedik şekilde kırmasın. Yerelde Flutter güncellenince burası da güncellenir.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Ortam dosyası
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL ve SUPABASE_ANON_KEY repo gizli değerleri tanımlı değil."
            exit 1
          fi
          mkdir -p env
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key, APP_ENV: "dev"}' > env/ci.json

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: APK derle
        run: flutter build apk --release --dart-define-from-file=env/ci.json

      - name: APK adını belirle
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/casper-test-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: casper-test-apk
          path: build/app/outputs/flutter-apk/casper-test-*.apk
          retention-days: 14
